services:
  - type: web
    name: sddp-apartment
    runtime: node
    plan: starter
    disk:
      name: sddp-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      - key: SDDP_DB_PATH
        value: /var/data/sddp.sqlite
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: GUEST_DATA_ENCRYPTION_KEY
        sync: false
